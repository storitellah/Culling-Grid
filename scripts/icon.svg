<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2f"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#5e5ce6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- 3x3 culling grid -->
  <g filter="url(#soft)">
    <g fill="#1c1c1f" stroke="#3a3a3d" stroke-width="3">
      <rect x="104" y="104" width="88" height="88" rx="18"/>
      <rect x="212" y="104" width="88" height="88" rx="18"/>
      <rect x="320" y="104" width="88" height="88" rx="18"/>
      <rect x="104" y="212" width="88" height="88" rx="18"/>
      <rect x="320" y="212" width="88" height="88" rx="18"/>
      <rect x="104" y="320" width="88" height="88" rx="18"/>
      <rect x="212" y="320" width="88" height="88" rx="18"/>
      <rect x="320" y="320" width="88" height="88" rx="18"/>
    </g>
    <!-- the selected frame -->
    <rect x="212" y="212" width="88" height="88" rx="18" fill="url(#accent)"/>
    <path d="M236 256 l14 14 l26 -30" fill="none" stroke="#fff" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
